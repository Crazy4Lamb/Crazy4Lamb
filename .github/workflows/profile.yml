name: Refresh profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile.yml']
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/stats.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh profile statistics and recent projects'
          git push
